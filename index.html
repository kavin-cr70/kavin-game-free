$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#back').onclick=()=>{cur=null;show('hub');render()};
function loop(t){const dt=Math.min(.05,(t-last)/1e3);last=t;
if(cur){cur.step(dt);c.save();R(0,0,W,H,'#000');cur.draw();
if(cur.over){if(!cur.saved){cur.saved=1;if(cur.score>hi){hi=cur.score;S.set(curId,hi)}}R(0,0,W,H,'rgba(0,0,0,.7)');T(cur.title||'GAME OVER',W/2,220,48,'#ff2bd6');T('Score '+cur.score+'  Best '+hi,W/2,265,22,'#ffe94d');T('Press R or click to retry',W/2,305,18,'#22e6ff')}
c.restore();$('#hud').textContent='SCORE '+cur.score+'   BEST '+Math.max(hi,cur.score)+'   '+cur.info}
requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
